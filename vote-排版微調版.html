function keepChineseWords(text) {
    return text.replaceAll("願望", "願\u2060望").replaceAll("人們", "人\u2060們");
}
function updateVoteContent(node) {
    const story = STORY_NODES[node];
    if (!story) return;
    document.getElementById("audienceStoryChapter").textContent = story.chapter;
    document.getElementById("audienceStoryTitle").textContent = story.title;
    const paragraphs = document.getElementById("audienceStoryParagraphs");
    paragraphs.replaceChildren();
    story.paragraphs.forEach(value => {
        const p = document.createElement("p");
        p.textContent = keepChineseWords(value);
        paragraphs.appendChild(p);
    });
    document.getElementById("voteQuestion").textContent = story.question;
    ["A", "B", "C"].forEach((letter, index) => {
        const button = document.getElementById("voteButton" + letter);
        const description = document.getElementById("audienceChoiceDesc" + letter);
        const choice = story.choices[index];
        button.style.display = choice ? "block" : "none";
        button.textContent = choice ? letter + "｜" + choice.title : "";
        description.textContent = choice ? keepChineseWords(choice.description) : "";
        description.style.display = choice && choice.description ? "block" : "none";
    });
}

async function checkGameStatus() {

  
 const { data, error } = await db
    .from("game_sessions")
    .select("status, current_node, round_id")
    .eq("id", 1)
    .single();
 if (error) {
    console.error("讀取遊戲狀態失敗：", error);
    return;
}  
// console.log("目前遊戲狀態：", data);   
if (data.status === "voting") {
    if (window.votedNode && (window.votedNode !== data.current_node || window.votedRoundId !== data.round_id)) {
    window.voteLocked = false;
    window.votedNode = null;
    window.votedRoundId = null;
    location.reload();
return;
}
    updateVoteContent(data.current_node);
  // console.log("目前開放投票！");
    if (!window.voteLocked) {
    voteContainer.style.display = "block";
}
waitingArea.style.display = "none";
} else {
    console.log("目前尚未開放投票！");
    voteContainer.style.display = "none";
waitingArea.style.display = "block";
} 
}    
async function submitVote(choice) {
    if (window.voteLocked) return;
window.voteLocked = true;
    const { data: game, error: gameError } = await db
        .from("game_sessions")
      .select("status, current_node, round_id")
        .eq("id", 1)
        .single();

    if (gameError || !game || game.status !== "voting") {
        alert("目前尚未開放投票！");
        window.voteLocked = false;
        return;
    }

    const { error } = await db
        .from("votes")
        .insert({
vote_node: game.current_node,
choice: choice,
round_id: game.round_id
        });

    if (error) {
        console.error("投票失敗：", error);
        alert("投票失敗，請稍後再試！");
        window.voteLocked = false;
    } else {
    window.votedNode = game.current_node;
    window.votedRoundId = game.round_id;
        // 投票成功後顯示感謝訊息
voteContainer.innerHTML = `
    <h1>分岔的命運</h1>
    <h2>你的選擇已被記錄</h2>
    <p>你選擇了 ${choice}</p>
    <p>命運的天秤正在傾斜……</p>
`;

// 投票成功後，保留觀眾的選擇紀錄
window.voteLocked = true;
    }
}
checkGameStatus();
window.statusInterval = setInterval(checkGameStatus, 1000);
