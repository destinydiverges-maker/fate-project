<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>分岔的命運</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap"
        rel="stylesheet">


    <style>

        /* ========================================
           整個網站
           ======================================== */

        * {
            box-sizing: border-box;
        }
        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            /* 網頁背景圖片 */
            background-image: url("images/網頁背景白.png");

            /* 背景置中 */
            background-position: center;

            /* 背景不重複 */
            background-repeat: no-repeat;

            /* 背景填滿整個畫面 */
            background-size: cover;

            /* 背景固定 */
            background-attachment: fixed;

            color: #4a3b2a;

            font-family:
                "LXGW WenKai TC",
                "Microsoft JhengHei",
                sans-serif;

            overflow-x: hidden;

        }


        /* ========================================
           網站背景
           之後可以換成你真正的主視覺
           ======================================== */

        #page {

            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;

            position: relative;

        }

        /* ==============================
        主標題區
        ============================== */

        #siteHeader {
            width: 100%;
            display: flex;
            justify-content: center;

            padding-top: 18px;
            padding-bottom: 5px;
        }


        /* 標題＋裝飾底線 */

        #titleArea {
            width: 520px;
            max-width: 70vw;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* 分岔的命運 */

        #titleArea h1 {
            margin: 0;

            font-size: 36px;
            font-weight: 400;

            letter-spacing: 10px;

            color: #5a4027;

            line-height: 1.2;
        }


        #titleUnderline {
            width: 600px;
            max-width: 80vw;

            height: auto;

            display: block;

            margin-top: 5px;
        }

        


        /* ========================================
           中央內容區

           影片和投票都會出現在這裡
           ======================================== */

        #mainContent {

            width: 100%;

            flex: 1;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 10px 30px 20px;

        }


        /* ========================================
           影片區域
           ======================================== */

        #videoArea {

            width: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

        }


        #chapterName {

            margin-top: 0;
            margin-bottom: 12px;

            font-size: 22px;

            font-weight: normal;

        }


        /* 沒有全螢幕時的影片 */

        #storyVideo {

            width: 65%;

            max-width: 950px;

           aspect-ratio: 16 / 9;
            object-fit: contain;

display: block;
            background-color: black;

            box-shadow:
                0 10px 35px rgba(74, 59, 42, 0.25);

        }


        /* ========================================
           投票區域
           ======================================== */

        #voteArea {

            width: 100%;

            display: none;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

        }


        #voteArea h2 {

            font-size: 48px;

            margin-top: 0;
            margin-bottom: 15px;

            letter-spacing: 5px;

        }


        #voteArea h3 {

            font-size: 28px;

            margin-top: 0;
            margin-bottom: 35px;

            font-weight: normal;

        }


        /* ========================================
           選項
           ======================================== */

        .choice {

            width: min(600px, 90%);

          margin-bottom: 10px;

        }


        .choice button {

            width: 100%;

  padding: 10px 20px;

            border: 1px solid white;

            background: rgba(0, 0, 0, 0.45);

            color: white;

            font-size: 22px;

            cursor: pointer;

            transition: 0.2s;

        }


        .choice button:hover {

            background: white;

            color: black;

        }


        .choice p {

            margin: 10px 0 0;

            font-size: 20px;

        }


        /* ========================================
           總票數
           ======================================== */

        #voteTotal {

            margin-top: 10px;

            font-size: 22px;

        }


        /* ========================================
           結束投票
           目前測試用
           ======================================== */

        #finishButton {

            margin-top: 25px;

            padding: 14px 35px;

            border: none;

            font-size: 20px;

            cursor: pointer;

        }


    
/* 第二版：恢復 P01 原本的閱讀比例，不為了硬塞一頁縮小字體 */

.choice-description { max-width: 650px; font-size: 16px; line-height: 1.55; margin: 7px auto 3px; }
#voteArea .choice p { font-size: 19px; margin: 7px 0 0; }
#voteArea #voteTotal { font-size: 20px; margin-top: 8px; }
#voteArea #finishButton { font-size: 20px; margin-top: 16px; padding: 10px 30px; }
#replayVoteVideoButton { font-size: 16px; margin-top: 8px; padding: 7px 16px; }
#ending09Area { width: min(940px, 100%); margin: 12px auto; padding: 16px 28px; text-align: center; color: #49392b; }
.ending09-title { font-size: 36px; margin: 8px 0 18px; font-weight: normal; }
.ending09-text { font-size: 18px; line-height: 1.75; }
.ending09-text p { margin: 0 0 12px; }
#ending09Restart { font: inherit; cursor: pointer; margin: 15px 0; padding: 10px 26px; color: #49392b; background: #fff9ee; border: 1px solid #a68b64; }
@media (max-width: 700px) {
  #mainContent { padding: 10px 14px; }
  #adminStoryIntro { padding: 0 4px; }
  .story-paragraphs { text-align: left; font-size: 16px; }
  #voteArea .choice { width: 100%; }
  #voteArea .choice button { font-size: 19px; }
  #ending09Area { padding: 12px; }
}
/* 中文排版微調：維持原字級與按鈕尺寸，改善詞語被拆開的情況 */
.story-paragraphs p, .choice-description, #adminVoteQuestion {
  word-break: keep-all;
  overflow-wrap: break-word;
  text-wrap: pretty;
}
</style>

</head>
